# AI Symptom Checker — full stack for VPS deployment.
# Frontend (nginx) is the only service exposed publicly; it reverse-proxies
# /api and /socket.io to the backend. Put a TLS reverse proxy (Traefik / nginx /
# Caddy) in front of the `frontend` service for HTTPS on your domain.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-symptom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-symptom_checker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symptom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 48)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${POSTGRES_USER:-symptom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-symptom_checker}
      MONGODB_URI: mongodb://mongo:27017/symptom_checker
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      APIMEDIC_USERNAME: ${APIMEDIC_USERNAME:-}
      APIMEDIC_PASSWORD: ${APIMEDIC_PASSWORD:-}
      ABDM_CLIENT_ID: ${ABDM_CLIENT_ID:-}
      ABDM_CLIENT_SECRET: ${ABDM_CLIENT_SECRET:-}
    expose:
      - "5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  mongodata:
